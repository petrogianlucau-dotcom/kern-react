<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#1c1917;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .story{width:1080px;height:1920px;position:relative;box-sizing:border-box;padding:220px 64px 300px;display:flex;flex-direction:column;justify-content:center;}
  .hook{color:#f4f1ec;font-size:56px;font-weight:700;line-height:1.15;margin-bottom:20px;letter-spacing:-0.5px;}
  .sub{color:#c9c2b8;font-size:27px;line-height:1.45;margin-bottom:44px;max-width:900px;}

  .netframe{position:relative;background:radial-gradient(ellipse 700px 500px at 50% 62%, rgba(234,124,60,0.14), rgba(20,18,16,0) 70%),
             linear-gradient(180deg,#17140f 0%,#0f0d0a 100%);
             border-radius:28px;border:1px solid rgba(244,241,236,0.08);
             box-shadow:0 40px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
             overflow:hidden;margin-bottom:44px;}
  .netframe::before{content:'';position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(244,241,236,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,241,236,0.035) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 600px 420px at 50% 60%, #000 30%, transparent 75%);
            mask-image:radial-gradient(ellipse 600px 420px at 50% 60%, #000 30%, transparent 75%);
  }
  .titlebar{position:relative;display:flex;align-items:center;gap:10px;padding:24px 28px;border-bottom:1px solid rgba(244,241,236,0.07);}
  .dot{width:12px;height:12px;border-radius:50%;}
  .titletext{color:#6b645c;font-size:20px;margin-left:10px;font-weight:500;}

  .stage{position:relative;width:952px;height:660px;margin:0 auto;}
  .card{position:absolute;width:172px;display:flex;flex-direction:column;align-items:center;}
  .iconbox{width:172px;height:172px;border-radius:28px;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 40%), #1c1815;
    border:1.5px solid var(--accent-border);
    box-shadow:0 0 0 1px rgba(0,0,0,0.4) inset, 0 20px 40px rgba(0,0,0,0.4), 0 0 46px -6px var(--accent-glow);
  }
  .iconbox svg{width:76px;height:76px;stroke:var(--accent);}
  .check{position:absolute;top:-10px;right:-10px;width:38px;height:38px;border-radius:50%;background:#3cb26b;display:flex;align-items:center;justify-content:center;border:4px solid #0f0d0a;box-shadow:0 4px 14px rgba(0,0,0,0.4);}
  .check svg{all:unset;width:18px;height:18px;}
  .clabel{margin-top:18px;color:#e9e4dc;font-size:23px;font-weight:600;text-align:center;line-height:1.25;}
  .ctag{margin-top:4px;color:var(--accent);font-size:16px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;opacity:0.85;}

  .hub{position:absolute;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle, #ffd8b0 0%, #EA7C3C 55%, rgba(234,124,60,0) 75%);
    box-shadow:0 0 50px 14px rgba(234,124,60,0.55);
  }
  .hubcore{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff2e4;top:8px;left:8px;box-shadow:0 0 14px 4px #fff2e4;}

  .statusline{text-align:center;color:#5c9c72;font-size:20px;font-weight:500;padding:0 0 30px;position:relative;}

  .cta{margin-top:56px;text-align:left;}
  .ctaline{color:#f4f1ec;font-size:36px;font-weight:700;margin-bottom:8px;}
  .ctasub{color:#EA7C3C;font-size:30px;font-weight:600;}
</style>
</head>
<body>
<div class="story">
  <div class="hook">Tu WhatsApp<br>respondiendo<br>solo</div>
  <div class="sub">Clasifica la consulta, responde lo básico y avisa al vendedor si hace falta una persona.</div>

  <div class="netframe">
    <div class="titlebar">
      <div class="dot" style="background:#ec6a5e"></div><div class="dot" style="background:#f4bf4f"></div><div class="dot" style="background:#61c454"></div>
      <span class="titletext">flujo real · n8n</span>
    </div>

    <div class="stage">
      <svg width="952" height="660" style="position:absolute;top:0;left:0;">
        <defs>
          <filter id="glowA" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M476,440 C 350,330 250,240 176,168" fill="none" stroke="#39C6A6" stroke-width="3" opacity="0.9" filter="url(#glowA)"/>
        <path d="M476,440 C 476,340 476,240 476,150" fill="none" stroke="#9B7BFF" stroke-width="3" opacity="0.9" filter="url(#glowA)"/>
        <path d="M476,440 C 602,330 702,240 776,168" fill="none" stroke="#EA7C3C" stroke-width="3" opacity="0.9" filter="url(#glowA)"/>
        <circle cx="326" cy="304" r="4" fill="#39C6A6"/>
        <circle cx="476" cy="295" r="4" fill="#9B7BFF"/>
        <circle cx="626" cy="304" r="4" fill="#EA7C3C"/>
      </svg>

      <div class="hub" style="left:463px;top:427px;"><div class="hubcore"></div></div>

      <div class="card" style="left:90px;top:0px;--accent:#39C6A6;--accent-border:rgba(57,198,166,0.35);--accent-glow:rgba(57,198,166,0.35);">
        <div class="iconbox">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="clabel">Llega por<br>WhatsApp</div>
        <div class="ctag">Trigger</div>
      </div>

      <div class="card" style="left:390px;top:-60px;--accent:#9B7BFF;--accent-border:rgba(155,123,255,0.35);--accent-glow:rgba(155,123,255,0.35);">
        <div class="iconbox">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        </div>
        <div class="clabel">Se clasifica<br>sola</div>
        <div class="ctag">IA</div>
      </div>

      <div class="card" style="left:690px;top:0px;--accent:#EA7C3C;--accent-border:rgba(234,124,60,0.4);--accent-glow:rgba(234,124,60,0.4);">
        <div class="iconbox">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </div>
        <div class="clabel">Responde<br>sola</div>
        <div class="ctag">Acción</div>
      </div>
    </div>

    <div class="statusline">● Ejecutado con éxito</div>
  </div>

  <div class="cta">
    <div class="ctaline">¿Querés uno así para tu negocio?</div>
    <div class="ctasub">Escribinos →</div>
  </div>
</div>
</body>
</html>
